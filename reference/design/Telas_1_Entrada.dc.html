<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Telas — entrada, home, criar e entrar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
sc-for,sc-if{display:contents}
</style>
</helmet>
<div style="width: 5304px; height: 1010px; box-sizing: border-box; padding: 40px 48px; background: #E7E7E2; font-family: 'Figtree', system-ui, sans-serif; color: #18181B; display: flex; gap: 48px">
  <sc-for list="{{screens}}" as="s" hint-placeholder-count="12">
    <div style="display: flex; flex-direction: column; gap: 14px; width: 390px; flex: none">
      <div style="height: 64px; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px">
        <span style="font: 800 13px 'Figtree', sans-serif; letter-spacing: .06em; color: #5D5E66">{{s.num}}</span>
        <span style="font: 800 21px 'Bricolage Grotesque', sans-serif; letter-spacing: -.01em">{{s.label}}</span>
      </div>
      <div style="width: 390px; height: 844px; border-radius: 36px; overflow: hidden; box-shadow: 0 20px 50px rgba(20,20,40,.18)">
        <dc-import name="Main" preset="{{s.p}}" theme="{{s.theme}}" role="{{s.role}}" hint-size="390px,844px"></dc-import>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":5304,"height":1010}}'>
class Component extends DCLogic {
  renderVals() {
    const L = [['login', 'Login'], ['home', 'Meus splits'], ['home-empty', 'Home · estado vazio'], ['home-loading', 'Home · carregando'], ['create', 'Criar split'], ['created', 'Split criado · convite'], ['join-error', 'Entrar · erro de validação'], ['join-who', 'Entrar · quem sou eu'], ['join-new', 'Entrar · não estou na lista'], ['home-guest', 'Home · sem conta'], ['created-guest', 'Split criado · sem conta'], ['recovery', 'Link de recuperação']];
    return { screens: L.map((x, i) => ({ p: x[0], label: x[1], num: '1.' + (i + 1), theme: 'light', role: 'admin' })) };
  }
}
</script>
</body>
</html>
