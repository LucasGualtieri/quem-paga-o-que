<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Telas — dentro do split</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
sc-for,sc-if{display:contents}
</style>
</helmet>
<div style="width: 4428px; height: 1010px; box-sizing: border-box; padding: 40px 48px; background: #E7E7E2; font-family: 'Figtree', system-ui, sans-serif; color: #18181B; display: flex; gap: 48px">
  <sc-for list="{{screens}}" as="s" hint-placeholder-count="10">
    <div style="display: flex; flex-direction: column; gap: 14px; width: 390px; flex: none">
      <div style="height: 64px; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px">
        <span style="font: 800 13px 'Figtree', sans-serif; letter-spacing: .06em; color: #5D5E66">{{s.num}}</span>
        <span style="font: 800 21px 'Bricolage Grotesque', sans-serif; letter-spacing: -.01em">{{s.label}}</span>
      </div>
      <div style="width: 390px; height: 844px; border-radius: 36px; overflow: hidden; box-shadow: 0 20px 50px rgba(20,20,40,.18)">
        <dc-import name="Main" preset="{{s.p}}" theme="light" role="{{s.role}}" hint-size="390px,844px"></dc-import>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":4428,"height":1010}}'>
class Component extends DCLogic {
  renderVals() {
    const L = [
      ['split-tx', 'a) Transações', 'admin'],
      ['split-loading', 'Transações · carregando', 'admin'],
      ['split-empty', 'Transações · vazio', 'admin'],
      ['split-saldos', 'b) Saldo · cartões por pessoa', 'admin'],
      ['split-saldo-all', 'b) Saldo · todos expandidos', 'admin'],
      ['split-minha', 'd) Minha visão', 'admin'],
      ['split-pessoas', 'e) Pessoas · admin', 'admin'],
      ['split-pessoas', 'e) Pessoas · membro', 'member'],
      ['finalize', '8) Finalizar split', 'admin'],
      ['finalized', 'Split finalizado · reabrir', 'admin']
    ];
    return { screens: L.map((x, i) => ({ p: x[0], label: x[1], role: x[2], num: '2.' + (i + 1) })) };
  }
}
</script>
</body>
</html>
