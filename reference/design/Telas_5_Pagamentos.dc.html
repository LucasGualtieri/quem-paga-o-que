<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Telas — pagamento, notificações e conta</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
sc-for,sc-if{display:contents}
</style>
</helmet>
<div style="width: 3552px; height: 1010px; box-sizing: border-box; padding: 40px 48px; background: #E7E7E2; font-family: 'Figtree', system-ui, sans-serif; color: #18181B; display: flex; gap: 48px">
  <sc-for list="{{screens}}" as="s" hint-placeholder-count="8">
    <div style="display: flex; flex-direction: column; gap: 14px; width: 390px; flex: none">
      <div style="height: 64px; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px">
        <span style="font: 800 13px 'Figtree', sans-serif; letter-spacing: .06em; color: #5D5E66">{{s.num}}</span>
        <span style="font: 800 21px 'Bricolage Grotesque', sans-serif; letter-spacing: -.01em">{{s.label}}</span>
      </div>
      <div style="width: 390px; height: 844px; border-radius: 36px; overflow: hidden; box-shadow: 0 20px 50px rgba(20,20,40,.18)">
        <dc-import name="Main" preset="{{s.p}}" theme="light" role="admin" platform="{{s.platform}}" hint-size="390px,844px"></dc-import>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":3552,"height":1010}}'>
class Component extends DCLogic {
  renderVals() {
    const L = [
      ['pay-sheet', 'Marcar como pago', 'web'],
      ['pay-sheet-proof', 'Com comprovante anexado', 'web'],
      ['home', 'Home · sino com aviso', 'web'],
      ['notifs', 'Notificações', 'web'],
      ['detail-notif', 'Aberto pela notificação', 'web'],
      ['proof', 'Ver comprovante', 'web'],
      ['account', 'Sua conta · web app', 'web'],
      ['account', 'Sua conta · app (com push)', 'app']
    ];
    return { screens: L.map((x, i) => ({ p: x[0], label: x[1], platform: x[2], num: '5.' + (i + 1) })) };
  }
}
</script>
</body>
</html>
