name: CI e Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, testes, regras, Functions e e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Os emuladores do Firebase exigem Java 21+.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Regras do Firestore e Cloud Functions contra os emuladores.
      - run: npm run test:emulators
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      # Screenshots em 390 e 1440 px ficam no artefato "e2e".
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e
          path: |
            apps/web/test-results
            apps/web/playwright-report
          retention-days: 14

  build:
    name: Build do Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Telas de desenvolvimento ligadas enquanto o produto não é lançado (ver docs/plan.md).
      - run: npm run build
        env:
          VITE_DEV_TOOLS: 'true'
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    name: Publicar no Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
