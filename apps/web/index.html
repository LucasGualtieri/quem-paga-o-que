<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Quem Paga O Quê?</title>
    <!-- Favicon provisório (public/; os PNGs saem de scripts/make-favicons.mjs). -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;500;600;700;800;900&display=swap"
    />
    <script>
      // Aplica o tema salvo antes do primeiro paint, para não piscar o tema claro.
      try {
        var t = localStorage.getItem('qpq.theme');
        document.documentElement.className = t === 'dark' ? 'theme-dark' : 'theme-light';
      } catch (e) {
        document.documentElement.className = 'theme-light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
